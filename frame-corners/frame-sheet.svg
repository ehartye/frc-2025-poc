<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="420mm" height="290.5mm" role="img" aria-labelledby="title desc">
<title id="title">Primary chassis corners and squaring fixture, drawing FC-01</title>
<desc id="desc">Plan of the square robot frame, three fixture pads, two side stops and a single end stop. The enlarged sections show the inside fillet, prepared groove, dress-flush end face and limited top and bottom reinforcement.</desc>
