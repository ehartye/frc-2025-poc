<text x="535" y="467" class="s">4 mm plate, 692 × 516. Match-drill upper wall and deck Ø5.50.</text><text x="535" y="495" class="s">Bottom wall only Ø8.20. Jig and gauge the paired bores coaxially.</text>
<path d="M38 521H1162" class="line"/>
<text x="38" y="559" class="h">C  ·  Make six, one original solid each</text>
<text x="38" y="590" class="s">7075-T7351 bar. Ø8 stem, Ø5 M5 stud. Drill Ø5.4 from Z46; deepest point Z136 max.</text>
<text x="38" y="619" class="s">Foot 19.5 × 22 × 4 centered on X±340. Lip extends inward to |X|328, rising to Z53.</text>
<text x="38" y="648" class="s">Lip outer face |X|329.8. Stud axis 1 mm inboard of crossrail axis. Tip Z164 nominal.</text>
<text x="38" y="677" class="s">Shoulder Z147.95 nominal. Fit each measured rail underside-to-upper-wall dimension minus 0.00–0.10.</text>
<text x="38" y="706" class="s">Finish and proof requirements, key fork, tool envelope and physical hold points appear in the shop notes.</text>
<text x="38" y="739" class="small">DECK-TIE-01 · Reference the reopened named STEP for the three changed stocks and eighteen installed articles.</text></svg>
