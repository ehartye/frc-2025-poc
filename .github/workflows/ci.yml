name: Project CI
# This workflow belongs to the project. It checks out the project and nothing else, and runs only the project's own
# files: the path and secret scan and the site check under scripts/ci/, and the README still check. On the default
# branch it then publishes the docs folder to GitHub Pages. It runs no design check: a design is checked before it is
# pushed.
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Scan and site check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Set lfs: true when a published file is stored with Git LFS.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # A personal machine path or a credential is public as soon as the branch is pushed.
      - name: Scan for personal paths and secrets
        run: node scripts/ci/scan.mjs .
      # Every listed design has its folder, every named file is there and every relative link leads somewhere.
      - name: Check the published site
        run: node scripts/ci/site-check.mjs docs
      # Each project README shows the current design's still below its title, the image exists and the caption names
      # the design and its status. The script needs Python's standard library and Git, nothing else.
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Check the README stills
        run: python scripts/cad-readmes.py .
      # GitHub Pages is set to publish from GitHub Actions, so the default branch uploads docs for the deploy job.
      - if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: docs

  deploy:
    name: Publish the site
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
