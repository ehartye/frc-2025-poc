name: Robot showcase
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    uses: ./.github/workflows/project-evidence.yml

  build:
    needs: evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Get the reviewed showcase builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ehartye/agent-frc
          ref: 92ddf41933dd6026b26493c1d2c91505e9d15914 # Agent FRC 0.48.0
          path: builder
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check native material and mass ownership
        run: node builder/scripts/assembly-accounting.mjs project/cad/assembly-engineering/issue/mapping.json > "$RUNNER_TEMP/engineering-mass.json"
      - name: Check receiver service assembly material and mass ownership
        run: node builder/scripts/assembly-accounting.mjs project/cad/assembly-engineering/receiver-service/issue/mapping.json > "$RUNNER_TEMP/receiver-service-mass.json"
      - name: Check the live lab with its original published runtime
        env:
          AGENT_FRC_PLUGIN_ROOT: ${{ github.workspace }}/builder
        run: node --test project/tests/live-field.test.mjs
      - name: Verify the manifest and build the public files
        run: node builder/scripts/robot-highlights.mjs project/highlights.json "$RUNNER_TEMP/showcase"
      - name: Withdraw the rough-draft showcase and publish the preliminary entry page
        run: node project/scripts/publish-capture.mjs project "$RUNNER_TEMP/showcase"
      - name: Get the preliminary release checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ehartye/agent-frc
          ref: f17e8bb6b4fdbf6c93e9dda8a6f9574144320168 # Agent FRC 0.101.1
          path: preliminary-tools
          persist-credentials: false
      - name: Add the checked preliminary design releases under preliminary-design/
        run: |
          python project/cad/preliminary-design/stage.py --check-index
          node preliminary-tools/scripts/preliminary-release.mjs verify project/docs/preliminary-design/releases/layout-001
          # The entry page already features and links the current preliminary design release.
          cp -r project/docs/preliminary-design "$RUNNER_TEMP/showcase/preliminary-design"
      - name: Hand the final output to an isolated verification runner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-showcase
          path: ${{ runner.temp }}/showcase
          include-hidden-files: true
          if-no-files-found: error

  mechanical:
    name: Mechanical model eligibility
    env:
      FRC_REQUIRE_ACTIVE_MODEL_SELECTION: "true"
      FRC_ACTIVE_MODEL_SELECTION: ${{ vars.FRC_ACTIVE_MODEL_SELECTION }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the candidate source for static comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the approved public presentation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 472144f37a7c51f120bb3c099f3699fb55c29335
          path: approved
          # The highlights manifest verifies historical source 6667eb09 via git ls-tree.
          fetch-depth: 0
          persist-credentials: false
      - name: Get the original field and presentation builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ehartye/agent-frc
          ref: 92ddf41933dd6026b26493c1d2c91505e9d15914
          path: builder
          persist-credentials: false
      - name: Verify the mechanical reviewer has an immutable release
        env:
          RELEASE: ${{ vars.AGENT_FRC_PLUGIN_SHA }}
        run: '[[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]]'
      - name: Get the separately reviewed private-issue verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ehartye/agent-frc
          ref: ${{ vars.AGENT_FRC_PLUGIN_SHA }}
          path: verifier
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Download the exact output produced by the project publisher
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-showcase
          path: ${{ runner.temp }}/showcase
      - name: Independently rebuild the public baseline and both field pages
        run: |
          node builder/scripts/robot-highlights.mjs approved/highlights.json "$RUNNER_TEMP/approved"
          node approved/scripts/publish-capture.mjs approved "$RUNNER_TEMP/approved"
          mkdir "$RUNNER_TEMP/field"
          node builder/scripts/kickoff.mjs --profile project/kickoff/live-profile.json --output "$RUNNER_TEMP/field/field-lab.html"
          role=project/experiments/swerve-drive/whole-robot-trade
          node builder/scripts/strategy-lab.mjs "$role/live-profile.json" "$role/refinement-study.json" --html "$RUNNER_TEMP/field/role-lab.html"
      - name: Check the source inventory and every final public byte
        env:
          REVIEW_PUBLIC_KEY: ${{ vars.MECHANICAL_REVIEW_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'c097a273bba59e539b1f38876b90c09a94244cd31b970259257cf670186edd7c' project/.github/showcase-station.json | sha256sum --check --status
          cp project/.github/showcase-station.json "$RUNNER_TEMP/station.json"
          if [[ -n "$REVIEW_PUBLIC_KEY" ]]; then
            printf '%s\n' "$REVIEW_PUBLIC_KEY" > "$RUNNER_TEMP/mechanical-review-public.pem"
          fi
          python approved/scripts/cad-readmes.py project
          node --input-type=module -e "import {selectActive, verifyCurrent} from './verifier/scripts/public-model-release.mjs'"
          node verifier/scripts/local-showcase-release.mjs check "$RUNNER_TEMP/station.json" project "$RUNNER_TEMP/showcase"
      - if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/showcase

  deploy:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: mechanical
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: robot-showcase-pages
      cancel-in-progress: false
    steps:
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
