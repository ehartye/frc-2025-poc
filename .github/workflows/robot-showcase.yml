name: Robot showcase
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Get the reviewed showcase builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ehartye/agent-frc
          ref: 92ddf41933dd6026b26493c1d2c91505e9d15914 # Agent FRC 0.48.0
          path: builder
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check native material and mass ownership
        run: node builder/scripts/assembly-accounting.mjs project/cad/assembly-engineering/issue/mapping.json > "$RUNNER_TEMP/engineering-mass.json"
      - name: Check receiver service assembly material and mass ownership
        run: node builder/scripts/assembly-accounting.mjs project/cad/assembly-engineering/receiver-service/issue/mapping.json > "$RUNNER_TEMP/receiver-service-mass.json"
      - name: Verify the live matches, field stock and timed service
        env:
          AGENT_FRC_PLUGIN_ROOT: ${{ github.workspace }}/builder
        run: node --test project/tests/live-field.test.mjs
      - name: Verify the manifest and build the public files
        run: node builder/scripts/robot-highlights.mjs project/highlights.json "$RUNNER_TEMP/showcase"
      - name: Publish student-controlled mechanism motion
        run: node project/scripts/publish-capture.mjs project "$RUNNER_TEMP/showcase"
      - name: Hand the final output to an isolated verification runner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-showcase
          path: ${{ runner.temp }}/showcase
          include-hidden-files: true
          if-no-files-found: error

  mechanical:
    name: Mechanical model eligibility
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the candidate source for static comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the approved public presentation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 54a6eef39b24101effb32da25f01865c237f298f
          path: approved
          persist-credentials: false
      - name: Get the original field and presentation builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ehartye/agent-frc
          ref: 92ddf41933dd6026b26493c1d2c91505e9d15914
          path: builder
          persist-credentials: false
      - name: Verify the mechanical reviewer has an immutable release
        env:
          RELEASE: ${{ vars.MECHANICAL_REVIEW_PLUGIN_SHA }}
        run: '[[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]]'
      - name: Get the separately reviewed private-issue verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ehartye/agent-frc
          ref: ${{ vars.MECHANICAL_REVIEW_PLUGIN_SHA }}
          path: verifier
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Download the exact output produced by the project publisher
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-showcase
          path: ${{ runner.temp }}/showcase
      - name: Independently rebuild the public baseline and both field pages
        run: |
          node builder/scripts/robot-highlights.mjs approved/highlights.json "$RUNNER_TEMP/approved"
          node approved/scripts/publish-capture.mjs approved "$RUNNER_TEMP/approved"
          mkdir "$RUNNER_TEMP/field"
          node builder/scripts/kickoff.mjs --profile project/kickoff/live-profile.json --output "$RUNNER_TEMP/field/field-lab.html"
          role=project/experiments/swerve-drive/whole-robot-trade
          node builder/scripts/strategy-lab.mjs "$role/live-profile.json" "$role/refinement-study.json" --html "$RUNNER_TEMP/field/role-lab.html"
      - name: Check the source inventory and every final public byte
        env:
          FRC_VERIFIED_FIELD_ROOT: ${{ runner.temp }}/field
        run: |
          node verifier/scripts/public-model-release.mjs audit project 54a6eef39b24101effb32da25f01865c237f298f .github/public-model-policy.json
          python approved/scripts/cad-readmes.py project
          node verifier/scripts/public-model-release.mjs audit-staged "$RUNNER_TEMP/approved" "$RUNNER_TEMP/showcase" approved/.github/staged-model-policy.json
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/showcase

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: mechanical
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: robot-showcase-pages
      cancel-in-progress: false
    steps:
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
