name: Project evidence
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Check the owner-selected verifier revision
        env:
          PIN: ${{ vars.AGENT_FRC_PLUGIN_SHA }}
        run: '[[ "$PIN" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ehartye/agent-frc
          ref: ${{ vars.AGENT_FRC_PLUGIN_SHA }}
          path: plugin
          persist-credentials: false
      - name: Get the runtime that issued the archived field study
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ehartye/agent-frc
          ref: ba9241e724d2425fcf007a9d125e8f87186d68bc
          path: historical-field
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: project/tests/requirements-ci.txt
      - name: Install project evidence dependencies
        run: |
          python -m pip install --only-binary=:all: -r project/tests/requirements-ci.txt
      - name: Run the local evidence entry point
        env:
          AGENT_FRC_PLUGIN_ROOT: ${{ github.workspace }}/plugin
          AGENT_FRC_HISTORICAL_FIELD_ROOT: ${{ github.workspace }}/historical-field
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git -C project merge-base --is-ancestor "$BASE" HEAD; then
            node plugin/scripts/project-checks.mjs project full
          else
            node plugin/scripts/project-checks.mjs project changed "$BASE"
          fi
