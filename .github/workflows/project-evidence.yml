name: Project evidence
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public assets and text in this revision
        run: python experiments/six-wheel/scripts/check_public_content.py
      - name: Verify CAD views and README coverage
        run: python scripts/cad-readmes.py . --template scripts/cad-orbit.html
      - name: Enforce the project layout
        run: node scripts/project-layout.mjs check .

