<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
<title id="title">How the drive cover stays on and comes off</title>
<desc id="desc">A side elevation shows two shell halves, four face screws and two end locators. Three separate steps show the removal path for the upper shell after the lower shell is free.</desc>
<rect width="920" height="460" fill="#f7f6ed"/>
<g font-family="Arial,sans-serif" fill="#172d36">
<text x="40" y="48" font-size="30" font-weight="bold">Drive cover · one wheel bay</text>
<text x="40" y="80" font-size="17">Side elevation, looking inboard. The other bay mirrors this one.</text>
<g transform="translate(458 226) scale(1.27 -1.27) translate(0 -76.2)">
<rect x="-305" y="34" width="610" height="86" rx="4.5" fill="#bad8d1" stroke="#203c46" stroke-width="2"/>
<path d="M-305 76.2H305" stroke="#203c46" stroke-width="2"/>
<g fill="#f7f6ed" stroke="#536b70" stroke-width="2">
<circle cx="-247.65" cy="76.2" r="12"/><circle cx="0" cy="76.2" r="12"/><circle cx="247.65" cy="76.2" r="12"/></g>
<g fill="#ac451e"><circle cx="-120" cy="64" r="4.5"/><circle cx="-120" cy="88" r="4.5"/><circle cx="120" cy="64" r="4.5"/><circle cx="120" cy="88" r="4.5"/></g>
<g fill="#29546b"><circle cx="-295" cy="76.2" r="5"/><circle cx="295" cy="76.2" r="5"/></g></g>
<text x="72" y="149" font-size="16" fill="#29546b">Grooved end locator</text>
<path d="M91 156L84 212" fill="none" stroke="#29546b"/>
<text x="310" y="149" font-size="16" fill="#883817">Face screw + removable shoulder</text>
<path d="M329 156L307 201" fill="none" stroke="#883817"/>
<text x="40" y="322" font-size="21" font-weight="bold">Service on a supported chassis</text>
<g font-size="16">
<text x="40" y="356" font-weight="bold">1 · Lower cover</text><text x="40" y="383">Remove its two face screws</text><text x="40" y="405">and shoulders. Drop 180 mm.</text>
<text x="350" y="356" font-weight="bold">2 · Open the wheel bay</text><text x="350" y="383">Remove three wheel assemblies,</text><text x="350" y="405">their shafts and paired spacers.</text>
<text x="655" y="356" font-weight="bold">3 · Upper cover</text><text x="655" y="383">Remove screws and shoulders.</text><text x="655" y="405">Lift 14, pull out 40, drop 194 mm.</text>
</g></g></svg>
