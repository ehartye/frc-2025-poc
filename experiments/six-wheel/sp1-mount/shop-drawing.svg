<text x="320" y="603" class="heavy" font-weight="bold">Eyelet runs on a smooth Ø4.00 shoulder</text>
<text x="320" y="633">10.50 outside fork · 5.50 gap · two 2.50 cheeks</text>
<text x="320" y="662">Shoulder 10.80 long · head Ø7.5 × 2.0 with 1.1 × 0.9 slot</text>
<text x="320" y="691">M3 × 0.5 × 5.7 thread · 3.2 × 7 × 0.5 washer at shoulder</text>
<text x="320" y="720">Measure end float and full lock-element engagement.</text>
<text x="804" y="575" class="h" font-size="22" font-weight="bold">D   Installation datums</text>
<text x="805" y="609">Cable line Y−127, Z415 · drawing target ±0.50 per axis</text>
<text x="805" y="639">Guide exit X26 · home pin X75 · extended pin X445</text>
<text x="805" y="669">Wire-to-shelf lever 70 mm · retained bolt pitch 16 mm</text>
<text x="805" y="699">Guide-to-pin 49 → 419 · shelf moves 370 mm</text>
<text x="805" y="729">Angle, eye slip and complete position chain require a gauge.</text>
<line x1="50" y1="764" x2="1350" y2="764" class="rule" stroke="#bfced1"/>
<text x="50" y="807" class="h" font-size="22" font-weight="bold">Machine and inspect</text>
<text x="50" y="842">6061-T6 adapter and fork. Select stainless pin stock. Locate bores ±0.10 from datums. Deburr and break exposed edges ≤0.25.</text>
<text x="50" y="874">Fork bore Ø4.10 +0.05/0, pin Ø4.00 0/−0.03. Minimum front ligament nominal 1.20. Check the actual supplied eye with gauge pins.</text>
<text x="50" y="906">Machine the fork and its mounting flange from a single piece. Compare all other contours to the seven-body neutral STEP at zero stroke.</text>
<text x="50" y="950" class="fine" font-size="14">Project drawing · SP1-MOUNT · first-article review · geometry and limits in README.md, fit.json and sp1-mount.step</text>
