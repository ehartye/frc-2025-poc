<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" font-family="Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Fixed receiver carriage support machining datums</title><desc id="d">Paired bracket profile with mast hole axes, sectioned front and rear interfaces, and forward service travel.</desc>
<rect width="1160" height="690" fill="#f8f7ef"/>
<text x="32" y="43" fill="#19343d" font-size="31">Fixed receiver carriage support</text>
<text x="32" y="75" fill="#19343d" font-size="18">Robot millimetres · X forward, Y left, Z up · mirror the mate about Y0</text>
<text x="32" y="111" fill="#19343d" font-size="20">Side view at the inboard mast face</text>
<polygon points="61.3,226.5 156.4,361.0 230.6,361.0 699.3,182.4 699.3,145.3 645.9,145.3 253.8,217.2 239.9,203.3 135.5,203.3 110.0,194.0 61.3,194.0" fill="#b9dac8" stroke="#19343d" stroke-width="1.3"/>
<polygon points="228.3,326.2 620.4,184.7 239.9,245.0" fill="#f8f7ef" stroke="#19343d" stroke-width="1.3"/>
<polygon points="147.1,326.2 147.1,256.6 93.8,224.2" fill="#f8f7ef" stroke="#19343d" stroke-width="1.3"/>
<polygon points="223.7,358.7 683.0,182.4 664.5,175.4 216.7,344.8" fill="#246956" stroke="#19343d" stroke-width="1.3"/>
<circle cx="172.6" cy="337.8" r="7.539999999999999" fill="#f8f7ef" stroke="#19343d"/>
<circle cx="214.4" cy="337.8" r="7.539999999999999" fill="#f8f7ef" stroke="#19343d"/>
<circle cx="172.6" cy="224.2" r="7.539999999999999" fill="#f8f7ef" stroke="#19343d"/>
<circle cx="214.4" cy="224.2" r="7.539999999999999" fill="#f8f7ef" stroke="#19343d"/>
<text x="720" y="147" fill="#19343d" font-size="21">Forward bridge seat</text>
<text x="720" y="180" fill="#19343d" font-size="18">X167, |Y|182 and 197, top Z438</text>
<text x="720" y="210" fill="#19343d" font-size="18">Ø5.50 through, 90° seat to Ø11.00.</text>
<text x="720" y="240" fill="#19343d" font-size="18">Set the actual head flush and in contact.</text>
<text x="720" y="292" fill="#19343d" font-size="21">Rear crossbar seat</text>
<text x="720" y="325" fill="#19343d" font-size="18">X−87, |Y|196. Pad bears at Z412.</text>
<text x="720" y="355" fill="#19343d" font-size="18">M6 × 1 from below, full thread ≥12 mm.</text>
<text x="32" y="440" fill="#19343d" font-size="21">Mast rows</text>
<text x="32" y="470" fill="#19343d" font-size="18">X−53 and −35 × Z350 and 399. Drill both mast walls Ø10.10 for Ø10/6.20 sleeves, nominal length 25.</text>
<text x="32" y="500" fill="#19343d" font-size="18">Bracket holes Ø6.50. The two pads register on the inboard mast face at |Y|210. Gauge with both masts supported.</text>
<text x="32" y="550" fill="#19343d" font-size="18">Remove the four mast bolts, rear screw and two flush front screws per side. Leave both original height locks in place.</text>
<text x="32" y="582" fill="#19343d" font-size="18">After confirming independent support, draw the unbolted plate 535 mm forward. Reverse this path for installation.</text>
<text x="32" y="632" fill="#19343d" font-size="17">Use the paired STEP solids for the rib, radii, lands and local socket relief. Do not scale the drawing.</text>
</svg>
