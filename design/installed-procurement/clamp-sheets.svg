<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">Inner carrier fastening · first article drawing IC-1</title>
<desc id="desc">A 56 by 52 mm end carrier has four square nut pockets with through holes and a central 28.62 mm bearing seat. A 96 by 66 mm center gearbox adapter has two four-hole M5 patterns and two gear screw clearances. Coordinates in the tables use the bottom left of each blank.</desc>
<rect width="1000" height="660" fill="white" /><text class="head" x="30" y="40" font-family="sans-serif" fill="#132e3b" font-size="23" font-weight="bold">Inner drivetrain clamps · IC-1</text><text x="30" y="68" font-family="sans-serif" fill="#132e3b" font-size="15">All dimensions in mm · robot X forward · Z up · coordinate origin at finished lower, rear corner</text>
<text class="sub" x="30" y="112" font-family="sans-serif" fill="#132e3b" font-size="18" font-weight="bold">A · End bearing carrier, 4 required</text>
<g transform="translate(64 325) scale(3.5 -3.5)"><rect class="stock" width="56" height="52" fill="#eef2f1" stroke="#243e48" stroke-width=".55" /><circle class="bore" cx="28" cy="26" r="14.31" fill="white" stroke="#29444a" stroke-width=".5" /><path class="axis" d="M-3 26H59 M28 -3V55" fill="none" stroke="#54838c" stroke-width=".24" stroke-dasharray="2 1" />
<g class="tap" fill="white" stroke="#953c23" stroke-width=".7"><rect x="3.9" y="3.9" width="10.2" height="10.2" /><circle cx="9" cy="9" r="2.65" /><rect x="3.9" y="37.9" width="10.2" height="10.2" /><circle cx="9" cy="43" r="2.65" /><rect x="41.9" y="3.9" width="10.2" height="10.2" /><circle cx="47" cy="9" r="2.65" /><rect x="41.9" y="37.9" width="10.2" height="10.2" /><circle cx="47" cy="43" r="2.65" /></g></g>
<text x="30" y="358" font-family="sans-serif" fill="#132e3b" font-size="15">Blank 56 x 52 x 6 - 6061-T6 aluminum</text>
<text x="30" y="390" font-family="sans-serif" fill="#132e3b" font-size="15">U / V coordinates from datum edges</text>
<text x="30" y="418" font-family="sans-serif" fill="#132e3b" font-size="15">Seat at (28, 26) · Ø28.62 drawing nominal</text>
<text x="30" y="445" font-family="sans-serif" fill="#132e3b" font-size="15">Dia 5.3 through at U = 9, 47 and V = 9, 43</text>
<text x="30" y="482" font-family="sans-serif" fill="#132e3b" font-size="15">Pocket 10.20 square x 3.75 from wheel face.</text>
<text x="30" y="506" font-family="sans-serif" fill="#132e3b" font-size="15">Ø2 corner reliefs; see 1:1 pattern.</text>
<text class="sub" x="480" y="112" font-family="sans-serif" fill="#132e3b" font-size="18" font-weight="bold">B · Center adapter, 2 required</text>
<g transform="translate(505 325) scale(2.8 -2.8)"><path class="stock" d="M20 0H76L96 20V46L76 66H20L0 46V20Z" fill="#eef2f1" stroke="#243e48" stroke-width=".55" /><g class="bore" fill="white" stroke="#29444a" stroke-width=".5"><circle cx="16" cy="33" r="7" /><circle cx="80" cy="33" r="7" /></g><circle class="bore" cx="48" cy="33" r="18" fill="white" stroke="#29444a" stroke-width=".5" /><path class="axis" d="M-3 33H99 M48 -3V69" fill="none" stroke="#54838c" stroke-width=".24" stroke-dasharray="2 1" />
<g class="bore" fill="white" stroke="#29444a" stroke-width=".5"><circle cx="48" cy="7.6" r="2.65" /><circle cx="48" cy="58.4" r="2.65" /></g><g class="tap" fill="white" stroke="#953c23" stroke-width=".7"><circle cx="29" cy="16" r="2.1" /><circle cx="67" cy="16" r="2.1" /><circle cx="29" cy="50" r="2.1" /><circle cx="67" cy="50" r="2.1" /><circle cx="8" cy="21" r="2.1" /><circle cx="88" cy="21" r="2.1" /><circle cx="8" cy="45" r="2.1" /><circle cx="88" cy="45" r="2.1" /></g></g>
<text x="480" y="358" font-family="sans-serif" fill="#132e3b" font-size="15">Steel 96 x 66 x 5 - clip each corner 20 x 20</text>
<text x="480" y="390" font-family="sans-serif" fill="#132e3b" font-size="15">Ø36 at (48, 33) · Ø5.3 at (48, 7.6), (48, 58.4)</text>
<text x="480" y="418" font-family="sans-serif" fill="#132e3b" font-size="15">M5 × 0.8 carrier · U = 29, 67 and V = 16, 50</text>
<text x="480" y="445" font-family="sans-serif" fill="#132e3b" font-size="15">M5 × 0.8 rail · U = 8, 88 and V = 21, 45</text>
<text x="480" y="482" font-family="sans-serif" fill="#132e3b" font-size="15">Ø14 windows at U = 16, 80 and V = 33.</text>
<text x="480" y="506" font-family="sans-serif" fill="#132e3b" font-size="15">One 10 × 10 × 6 steel block per end clamp.</text>
<path d="M30 536H970" stroke="#567c81" /><text class="small" x="30" y="564" font-family="sans-serif" fill="#132e3b" font-size="13">Steel square blocks: drill dia 4.2 at (5, 5), tap M5 x 0.8 through. Gauge threads and keep finishes clear of bearing seats and clamp faces.</text>
<text class="small" x="30" y="590" font-family="sans-serif" fill="#132e3b" font-size="13">Coordinate target ±0.10. Datum faces flat to 0.10 across each blank. Verify bearing OD, press fit and lot drawing on a coupon before boring.</text>
<text class="small" x="30" y="616" font-family="sans-serif" fill="#132e3b" font-size="13">Pattern DXFs are 1:1. This sheet is a dimensioned reference. Clamp screw lengths, edge distances, stack allowances and shop sequence are in the build notes.</text>
</svg>
