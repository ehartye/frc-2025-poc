<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 465" role="img" aria-labelledby="t d">
  <title id="t">Right-side signal light mount</title>
  <desc id="d">Top view of the electronics deck, a detail of the keyed hole, and a section through the plate and spacer. All dimensions are millimetres.</desc>
  <style>
    text{font:15px system-ui,sans-serif;fill:#263a40}.title{font:bold 23px system-ui,sans-serif}.label{font:bold 16px system-ui,sans-serif}.sm{font-size:13px}
    .edge{stroke:#284449;stroke-width:1.8;fill:#d7e2df}.hole{fill:#fff;stroke:#284449;stroke-width:1.4}.lead{fill:none;stroke:#3d5c62;stroke-width:1.2}.axis{stroke:#8c9b98;stroke-dasharray:5 4;stroke-width:1}.gold{fill:#deb77b;stroke:#754f15;stroke-width:1.5}
  </style>
  <rect width="860" height="465" fill="#fff"/>
  <text x="25" y="34" class="title">Right-side signal light mount</text>
  <text x="25" y="58">Robot coordinates · dimensions in mm</text>
  <text x="26" y="95" class="label">Deck outline, top view</text>
  <g transform="translate(57 234) scale(.52 -.52)">
    <path class="edge" stroke-width="3" d="M1 211 H337 V-211 H178 V-250 A33 33 0 0 0 112 -250 V-211 H1 Z"/>
    <circle cx="145" cy="-250" r="11.4" fill="#fff" stroke="#284449" stroke-width="2"/>
  </g>
  <path class="lead" d="M133 364 L164 397 H266"/>
  <text x="164" y="418">Center (145, −250)</text>
  <text x="63" y="224">Electronics deck</text>
  <path class="lead" d="M238 344 H298 M298 344 l-8 -4 m8 4 l-8 4"/>
  <text x="246" y="334" class="sm">+X front</text>
  <path class="lead" d="M41 269 V204 M41 204 l-4 8 m4 -8 l4 8"/>
  <text x="15" y="192" class="sm">+Y left</text>
  <text x="355" y="95" class="label">Key relief, top view</text>
  <g transform="translate(440 193) scale(4 -4)">
    <circle r="16" fill="#d7e2df"/>
    <circle r="11.4" class="hole" stroke-width=".35"/>
    <rect x="-11.6" y="-9.1" width="4.1" height="4.5" fill="#fff" stroke="#3d5c62" stroke-dasharray="1 .55" stroke-width=".35"/>
  </g>
  <path class="axis" d="M367 193 H511 M440 120 V266"/>
  <path class="lead" d="M472 158 L496 130 H549"/>
  <text x="501" y="123">Ø22.8</text>
  <path class="lead" d="M394 230 L373 267 V277"/>
  <text x="326" y="298">4.1 × 4.5 through relief</text>
  <text x="326" y="319" class="sm">Lower X/Y corner relative to center</text>
  <text x="326" y="338" class="sm">X −11.6 · Y −9.1</text>
  <text x="598" y="95" class="label">Installed stack, section</text>
  <path class="axis" d="M705 124 V276"/>
  <path class="edge" d="M599 172 H682 V184 H599 Z M728 172 H810 V184 H728 Z"/>
  <path class="gold" d="M669 184 H682 V200 H669 Z M728 184 H741 V200 H728 Z"/>
  <path class="lead" d="M749 172 H801 M749 200 H801"/>
  <text x="598" y="238">3 mm aluminum deck</text>
  <text x="598" y="261">4 mm spacer · Ø32 / Ø22.8</text>
  <text x="598" y="290" class="sm">Lamp shoulder seats above the deck.</text>
  <text x="598" y="309" class="sm">Retaining nut bears on the spacer.</text>
  <text x="25" y="448" class="sm">Use the mount STEP for the finished outline and the purchased light to verify the key, bearing faces and tool access.</text>
</svg>
