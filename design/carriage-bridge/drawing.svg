<text x="405" y="212">Through windows, all internal corners R8.</text><text x="405" y="258" font-size="20" font-weight="bold">Retain mounting lands</text>
<text x="405" y="288">Green · full outer slide rail footprints.</text><text x="405" y="318">Blue-gray · underside crossbar.</text><text x="405" y="348">Ochre · rack bed, motor bracket and bearing.</text>
<text x="405" y="393" font-size="20" font-weight="bold">Machining and inspection</text><text x="405" y="425">Use the 1:1 metric DXF and window coordinates.</text><text x="405" y="455">Datum A is the lower face. B is rear, C is right.</text><text x="405" y="485">Inspect thickness, flatness and pocket radii.</text><text x="405" y="515">Deburr both faces. Keep attachment lands flat.</text><text x="405" y="552" font-weight="bold">Nominal material mass 1.136 kg.</text></g>
<text x="50" y="586" font-size="14">Rear/right datum (0,0). IDs correspond to the operation table.</text></svg>
