<text class="fine" x="730" y="294">Side · Y-normal pin bores</text>
<text class="fine" x="485" y="340">Each pin axis is 3.50 mm above the lower block face.</text>
<text class="fine" x="485" y="364">Pins Ø3 × 20. Ream steel to measured interference.</text>
<text class="fine" x="485" y="388">Open both 3.00 mm channel walls to Ø3.10.</text>
<text class="fine" x="485" y="412">Gage flush ends and check the 1.00 mm thread-to-pin web.</text>
<line x1="35" y1="440" x2="985" y2="440" class="dim"/>
<text class="sub" x="36" y="475">Clamping stack · wheel side outward</text>
<text x="36" y="505">M5×16 cap screw → 1.00 washer → 6.00 carrier → 2.00 tube wall → 8.00 steel saddle</text>
<text class="fine" x="36" y="531">7.00 nominal engagement. Six saddles, 24 screws and 24 washers per chassis. Verify realized preload and driver access.</text>
<text class="sub" x="36" y="574">Receiver stack · underside of screw head down</text>
<text x="36" y="603">40.00 grip → 6.00 thread engagement → 1.00 clearance to the block bottom</text>
<text class="fine" x="36" y="629">Four blocks and eight cross pins. Fit, pullout, fatigue and release are subject to first-article checks in JOINTS.md.</text>
