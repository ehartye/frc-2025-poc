<text x="35" y="510" font-size="18" fill="#203039">Rail   X −116 and +42  ×  Z128 and 141.5. Mast   X −51 and −33  ×  Z194 and 263.</text>
<text x="35" y="540" font-size="18" fill="#203039">Splice Ø6.50 throughout. Mast Ø10.10 both walls for Ø10/6.20 × 25 sleeves. Rail Ø6.50 through its 6 mm web.</text>
<text x="35" y="570" font-size="18" fill="#203039">Stock 8 mm 7075-T7351. Base 3 mm, ribs 8 mm total. Match the STEP contours; deburr and gauge real stock.</text>
<text x="35" y="600" font-size="17" fill="#203039">Deck slots X −135…+68, |Y|235.0…238.6. Keep the original rail land. Lift the disengaged splice 35 mm.</text>
