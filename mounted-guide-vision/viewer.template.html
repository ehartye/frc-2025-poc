<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Which guide blocks the field camera?</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#193731;background:#f1f3ea}*{box-sizing:border-box}main{max-width:1100px;margin:auto;padding:clamp(18px,4vw,60px)}h1{font:700 clamp(34px,5vw,57px)/1.04 Georgia,serif;margin:0 0 .4em}p{max-width:78ch;line-height:1.5}fieldset{border:0;padding:0;display:flex;flex-wrap:wrap;gap:1rem;margin:1.5rem 0}label{display:flex;align-items:center;gap:.4rem}select{font:inherit;padding:.25em}figure{margin:0;background:#fff;border:1px solid #b6c9bc;padding:1rem;border-radius:.4em}canvas{width:100%;height:auto}input{width:100%;accent-color:#1c614e}.legend{font-size:.94rem}a{color:#185744}
</style><main><h1>Which guide blocks the field camera?</h1><p>The robot uses two surveyed reef fasteners to align its scoring shelf. Step through the projected fastener windows and see when the mounted guides hide them from each pupil.</p>
<fieldset><label>Installation <select id="mount"><option value="nominal">Nominal</option><option value="outward">0.315 mm outward</option></select></label><label>Smaller wheel <select id="side"><option value="leftSmall">Left</option><option value="rightSmall">Right</option></select></label></fieldset>
<figure><canvas width="1000" height="405" id="plots" aria-label="Guide silhouettes from the two fixed camera pupils"></canvas><figcaption class="legend">The lower left arm is orange and its backing is tan. Green windows have a clear foreground. Dark crossed windows have foreground material. Each box is labeled with its field fastener ID.</figcaption></figure>
<p><label for="time">Time since sector approach began <output id="stamp"></output></label><input id="time" type="range" min="0" max="6" step="1" value="3"></p><p id="decision" aria-live="polite"></p><p><a href="README.md">Open the station custody and mechanical control results</a></p></main>
<script id="data" type="application/json">STUDY_DATA</script><script>
const data=JSON.parse(document.getElementById('data').textContent),e=id=>document.getElementById(id),images={};
for(const [key,row] of Object.entries(data)){images[key]=row.eyes.map(src=>{const i=new Image();i.onload=()=>draw();i.src=src;return i})}
function draw(){const key=e('mount').value,s=e('side').value,row=data[key].sides[s],f=row.frames[Number(e('time').value)],c=e('plots').getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,1000,405);
 for(let j=0;j<2;j++){const name=j?'right':'left',x=15+j*500,y=30,w=470,h=352.5;c.fillStyle='#203a30';c.font='bold 19px sans-serif';c.fillText(j?'Right pupil':'Left pupil',x,19);if(images[key]&&images[key][j].complete)c.drawImage(images[key][j],x,y,w,h);for(const q of f.features.filter(k=>k.eye===name)){const [l,t,r,b]=q.window.map(n=>n*w/640),cx=x+l,cy=y+t;c.strokeStyle=q.clear?'#075d46':'#392125';c.lineWidth=2.5;c.strokeRect(cx-2,cy-2,r-l+4,b-t+4);if(!q.clear){c.beginPath();c.moveTo(cx-2,cy-2);c.lineTo(x+r+2,y+b+2);c.stroke()}c.font='bold 12px sans-serif';c.fillStyle=c.strokeStyle;c.fillText(q.id,cx-3,cy-7)}}
 e('stamp').textContent=(f.ms/1000).toFixed(3)+' s';e('decision').textContent='The complete robot stops '+row.shortMm.toFixed(2)+' mm short of the goal. Its scoring rack stays stowed.'}
e('mount').onchange=e('side').onchange=e('time').oninput=draw;draw();
</script></html>
